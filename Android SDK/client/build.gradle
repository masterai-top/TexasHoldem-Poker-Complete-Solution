apply plugin: 'com.android.library'

android {
    compileSdkVersion 31
    buildToolsVersion "29.0.2"


    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    def billing_version = "3.0.0"

//    implementation 'com.google.android.gms:play-services-auth:20.1.0'

    //implementation 'com.facebook.android:facebook-android-sdk:latest.release'
//    implementation "com.facebook.android:facebook-login:13.2.0" //备注latest.release，或[11,13)区间可能导致下载失败
//    implementation "com.facebook.android:facebook-share:13.2.0"

//    implementation "com.android.billingclient:billing:$billing_version"
    compileOnly fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    // 总的项目中需要额外添加的内容mavenCentral
    implementation 'com.android.installreferrer:installreferrer:1.0'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation files("libs/msa_mdid_1.0.13.aar")
    implementation files("libs/app-release.aar")


    //implementation 'com.appsflyer:af-android-sdk:5.4.0'
}
buildscript {
    repositories {
        google()
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.4.0'
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}